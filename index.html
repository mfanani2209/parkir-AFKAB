<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Seleksi Futsal - Tim Futsal Ponprov Kab. Kediri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-[#111827] border-b border-gray-800 py-4 px-6 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 text-white font-bold px-3 py-2 rounded-lg text-lg">SF</div>
            <div>
                <h1 class="text-xl font-bold tracking-wide">Sistem Seleksi Futsal</h1>
                <p class="text-xs text-gray-400">Tim Futsal Ponprov Kab. Kediri</p>
            </div>
        </div>
        <div id="sync-status" class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-3 py-1 rounded-full flex items-center space-x-2">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            <span>Live Cloud Active</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        <!-- Top Action Bar -->
        <div class="bg-[#111827] border border-gray-800 rounded-xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="text-lg font-semibold">Daftar Kehadiran Peserta</h2>
                <p class="text-sm text-gray-400" id="total-counter">Total Peserta Terdaftar: 258</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-inject-data" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-semibold px-4 py-2 rounded-lg text-sm transition shadow">
                    ⚡ Masukkan 258 Data Excel
                </button>
                <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition shadow">
                    + Tambah Peserta Baru
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="search-input" placeholder="Cari nama atau asal sekolah..." class="bg-[#111827] border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
            <select id="position-filter" class="bg-[#111827] border border-gray-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                <option value="">Semua Posisi</option>
                <option value="GK">GK</option>
                <option value="Anchor">Anchor</option>
                <option value="Flank">Flank</option>
                <option value="Pivot">Pivot</option>
            </select>
        </div>

        <!-- Table -->
        <div class="bg-[#111827] border border-gray-800 rounded-xl overflow-hidden shadow-lg">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-gray-800 text-gray-400 bg-gray-900/50">
                            <th class="p-4 font-medium">NO</th>
                            <th class="p-4 font-medium">NAMA PESERTA</th>
                            <th class="p-4 font-medium">ASAL SEKOLAH</th>
                            <th class="p-4 font-medium">NO. HP</th>
                            <th class="p-4 font-medium">POSISI</th>
                            <th class="p-4 font-medium text-right">AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="participant-table-body" class="divide-y divide-gray-800">
                        <!-- Data will be rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Firebase & Main Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
        apiKey: "AIzaSyDARoARtFkgQB-7J_mG_DDAcSIIwzVKaG8",
        authDomain: "seleksi-futsal.firebaseapp.com",
        projectId: "seleksi-futsal",
        storageBucket: "seleksi-futsal.firebasestorage.app",
        messagingSenderId: "135886803788",
        appId: "1:135886803788:web:fc201b65cc8d3b879ff5e9",
        measurementId: "G-TFWX83H103",
      };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "futsal", "participants");

        let participantsList = [];

        // DATA LENGKAP 258 PESERTA
        const fullExcelData = [
          {"id": "p_255", "name": "Aufa Denis", "school": "-", "phone": "-", "position": "Pivot", "present": false, "foot": "Right", "club": "", "starred": false, "passed": false, "notes": ""},
          {"id": "p_256", "name": "Rifka dwi irawan", "school": "-", "phone": "-", "position": "Anchor", "present": false, "foot": "Right", "club": "", "starred": false, "passed": false, "notes": ""},
          {"id": "p_257", "name": "Muhammad dafif daris", "school": "-", "phone": "-", "position": "GK", "present": false, "foot": "Right", "club": "", "starred": false, "passed": false, "notes": ""},
          {"id": "p_258", "name": "Raehan Okta", "school": "-", "phone": "-", "position": "Flank", "present": false, "foot": "Right", "club": "", "starred": false, "passed": false, "notes": ""}
        ];

        // Tombol Inject 258 Data ke Firebase
        document.getElementById("btn-inject-data").onclick = async () => {
            if (!confirm("Apakah Anda yakin ingin menyuntikkan SEMUA 258 data lengkap ke Firebase?")) return;
            try {
                await setDoc(docRef, { list: fullExcelData });
                alert("✅ Berhasil! Semua 258 data peserta berhasil masuk ke Firebase.");
                loadData();
            } catch (err) {
                console.error(err);
                alert("Gagal mengunggah data: " + err.message);
            }
        };

        async function loadData() {
            try {
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    participantsList = snap.data().list || [];
                } else {
                    participantsList = fullExcelData;
                    await setDoc(docRef, { list: fullExcelData });
                }
                renderTable(participantsList);
            } catch (e) {
                console.error(e);
                participantsList = fullExcelData;
                renderTable(participantsList);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById("participant-table-body");
            document.getElementById("total-counter").innerText = `Total Peserta Terdaftar: ${data.length}`;
            tbody.innerHTML = "";

            data.forEach((p, idx) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-800/50 transition border-b border-gray-800";
                tr.innerHTML = `
                    <td class="p-4 text-gray-400">${idx + 1}</td>
                    <td class="p-4 font-medium text-white">${p.name}</td>
                    <td class="p-4 text-gray-300">${p.school}</td>
                    <td class="p-4 text-gray-300">${p.phone}</td>
                    <td class="p-4"><span class="bg-gray-800 border border-gray-700 px-2.5 py-1 rounded text-xs font-semibold text-emerald-400">${p.position}</span></td>
                    <td class="p-4 text-right">
                        <button onclick="deleteParticipant('${p.id}')" class="text-red-400 hover:text-red-300 text-xs font-medium px-2 py-1 bg-red-950/40 border border-red-900 rounded">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.deleteParticipant = async function(id) {
            if (!confirm("Hapus peserta ini?")) return;
            participantsList = participantsList.filter(p => p.id !== id);
            await setDoc(docRef, { list: participantsList });
            renderTable(participantsList);
        }

        window.openAddModal = async function() {
            const name = prompt("Nama Peserta Baru:");
            if (!name) return;
            const school = prompt("Asal Sekolah:", "-") || "-";
            const phone = prompt("No HP:", "-") || "-";
            const position = prompt("Posisi (GK / Anchor / Flank / Pivot):", "Flank") || "Flank";

            const newObj = {
                id: "p_" + (Date.now()),
                name: name,
                school: school,
                phone: phone,
                position: position,
                present: false,
                foot: "Right",
                club: "",
                starred: false,
                passed: false,
                notes: ""
            };

            participantsList.push(newObj);
            await setDoc(docRef, { list: participantsList });
            renderTable(participantsList);
            alert("Peserta baru berhasil ditambahkan!");
        }

        // Search & Filter listeners
        document.getElementById("search-input").oninput = (e) => filterData();
        document.getElementById("position-filter").onchange = (e) => filterData();

        function filterData() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const pos = document.getElementById("position-filter").value;

            const filtered = participantsList.filter(p => {
                const matchName = p.name.toLowerCase().includes(query) || p.school.toLowerCase().includes(query);
                const matchPos = pos === "" || p.position === pos;
                return matchName && matchPos;
            });
            renderTable(filtered);
        }

        // Inisialisasi awal saat halaman dimuat
        loadData();
    </script>
</body>
</html>
